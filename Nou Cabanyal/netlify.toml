# Configuración para publicar en Netlify (web + funciones de pago)
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Las funciones responden en /api/...
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# No publicar los archivos internos del servidor
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Las fotos no cambian casi nunca: que el navegador las guarde en caché mucho tiempo
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
